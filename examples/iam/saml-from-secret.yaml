# Reads the identity provider metadata from a Secret. Editing the Secret
# updates Nexus on the next reconcile.
apiVersion: v1
kind: Secret
metadata:
  name: saml-idp-metadata
  namespace: default
type: Opaque
stringData:
  metadata.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <md:EntityDescriptor xmlns:md="urn:oasis:names:tc:SAML:2.0:metadata" entityID="https://idp.example.com">
      <!-- Your IdP metadata here -->
    </md:EntityDescriptor>
---
apiVersion: iam.nexus.crossplane.io/v1alpha1
kind: SAML
metadata:
  name: saml-config
  namespace: default
spec:
  forProvider:
    idpMetadataFrom:
      secretRef:
        name: saml-idp-metadata
        key: metadata.xml
    entityId: "https://nexus.example.com/saml"
    usernameAttribute: "username"
  providerConfigRef:
    kind: ProviderConfig
    name: default
