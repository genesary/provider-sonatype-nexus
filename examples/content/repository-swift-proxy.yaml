# Swift proxy repository example
apiVersion: content.nexus.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: swift-proxy
  namespace: default
spec:
  forProvider:
    name: swift-proxy
    format: swift
    type: proxy
    online: true
    proxy:
      remoteUrl: https://github.com/
      contentMaxAge: 1440
      metadataMaxAge: 1440
    negativeCache:
      enabled: true
      timeToLive: 1440
    httpClient:
      blocked: false
      autoBlock: true
    storage:
      blobStoreName: default
      strictContentTypeValidation: true
    swift:
      requireAuthentication: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
