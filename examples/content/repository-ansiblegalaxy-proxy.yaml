# Ansible Galaxy proxy repository example
apiVersion: content.nexus.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: ansiblegalaxy-proxy
  namespace: default
spec:
  forProvider:
    name: ansiblegalaxy-proxy
    format: ansiblegalaxy
    type: proxy
    online: true
    proxy:
      remoteUrl: https://galaxy.ansible.com/
      contentMaxAge: 1440
      metadataMaxAge: 1440
    negativeCache:
      enabled: true
      timeToLive: 1440
    httpClient:
      blocked: false
      autoBlock: true
    storage:
      blobStoreName: default
      strictContentTypeValidation: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
