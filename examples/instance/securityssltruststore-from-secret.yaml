# Reads the certificate from a Secret, such as one cert-manager maintains.
# Replacing the certificate in the Secret replaces it in Nexus on the next
# reconcile. Of several certificates, only the first is added.
apiVersion: v1
kind: Secret
metadata:
  name: internal-ca
  namespace: default
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    ...your certificate content here...
    -----END CERTIFICATE-----
---
apiVersion: instance.nexus.crossplane.io/v1alpha1
kind: SecuritySSLTruststore
metadata:
  name: internal-ca
  namespace: default
spec:
  forProvider:
    pemFrom:
      secretRef:
        name: internal-ca
        key: ca.crt
  providerConfigRef:
    kind: ProviderConfig
    name: default
