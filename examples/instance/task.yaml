---
# Runs the cleanup policies of every repository each Sunday and Wednesday at
# 02:00 UTC, from 1 January 2027.
apiVersion: instance.nexus.crossplane.io/v1alpha1
kind: Task
metadata:
  name: weekly-cleanup
  namespace: default
spec:
  forProvider:
    name: weekly-cleanup
    type: repository.cleanup
    enabled: true
    alertEmail: nexus-admins@example.com
    notificationCondition: FAILURE
    schedule:
      type: weekly
      startDate: "2027-01-01T02:00:00Z"
      recurringDays: [1, 4] # 1 = Sunday ... 7 = Saturday
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
# Compacts the default blob store every night at 03:30, Paris winter time.
apiVersion: instance.nexus.crossplane.io/v1alpha1
kind: Task
metadata:
  name: compact-default-blobstore
  namespace: default
spec:
  forProvider:
    name: compact-default-blobstore
    type: blobstore.compact
    schedule:
      type: cron
      cronExpression: "0 30 3 * * ?"
      timeZoneOffset: "+01:00"
    properties:
      blobstoreName: default
      blobsOlderThan: "7"
  providerConfigRef:
    kind: ProviderConfig
    name: default
