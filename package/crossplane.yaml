apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sonatype-nexus
  annotations:
    meta.crossplane.io/maintainer: AYDEV-FR <aymeric.deliencourt@aydev.fr>
    meta.crossplane.io/source: github.com/genesary/provider-sonatype-nexus
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A Crossplane provider for managing Sonatype Nexus Repository Manager
      resources: repositories, blob stores, security and instance settings.
    meta.crossplane.io/readme: |
      `provider-sonatype-nexus` brings Sonatype Nexus Repository Manager
      configuration under Crossplane management.

      Supported resources:
      - Content: Repository (hosted, proxy and group, for Maven2, npm,
        Docker and 16 other formats), CleanupPolicy, ContentSelector,
        RoutingRule
      - IAM: User, Role, Privilege, AnonymousAccess, LDAP, SAML,
        UserTokenConfiguration
      - Instance: BlobStore (File and S3), Capability, HTTPClient,
        IQServerConfiguration, License, SecurityRealm, SecuritySSLTruststore,
        SSRFProtection, Task

      For setup, provider flags and examples, see the repository
      [README](https://github.com/genesary/provider-sonatype-nexus/blob/main/README.md).
spec:
  capabilities:
    - safe-start
