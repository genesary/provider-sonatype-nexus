---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: repositories.content.nexus.crossplane.io
spec:
  group: content.nexus.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nexus
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is the Schema for the repositories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RepositorySpec defines the desired state of Repository.

              The signing keys Nexus requires are only required when the provider may
              create or update the repository: one imported with Observe alone is never
              written to.
            properties:
              forProvider:
                description: RepositoryParameters defines the desired state of a Repository.
                properties:
                  alpineSigning:
                    description: |-
                      AlpineSigning is the RSA key Nexus signs the APK index of an alpine
                      repository with. It is required for proxy and group repositories,
                      unless the managementPolicies only observe the repository.
                    properties:
                      keypair:
                        description: Keypair is the RSA signing key pair (PEM armored
                          private key).
                        type: string
                      passphrase:
                        description: Passphrase to access the RSA signing key.
                        type: string
                    required:
                    - keypair
                    type: object
                  apt:
                    description: Apt specific configuration.
                    properties:
                      distribution:
                        description: Distribution for APT repository.
                        type: string
                      flat:
                        description: Flat determines if the repository uses flat format.
                        type: boolean
                    type: object
                  aptSigning:
                    description: AptSigning configuration for APT hosted repositories.
                    properties:
                      keypair:
                        description: Keypair is the PGP signing key pair (armored
                          private key).
                        type: string
                      passphrase:
                        description: Passphrase to access PGP signing key.
                        type: string
                    required:
                    - keypair
                    type: object
                  bower:
                    description: |-
                      Bower specific configuration.

                      Deprecated: Nexus no longer supports the Bower format, so this field is
                      ignored.
                    properties:
                      rewritePackageUrls:
                        description: RewritePackageUrls forces Bower to retrieve packages
                          through this proxy.
                        type: boolean
                    type: object
                  cargo:
                    description: Cargo specific configuration.
                    properties:
                      requireAuthentication:
                        description: |-
                          RequireAuthentication indicates if this repository requires
                          authentication. It is turned off when left unset.
                        type: boolean
                    type: object
                  cleanup:
                    description: Cleanup configuration.
                    properties:
                      policyNameRefs:
                        description: |-
                          PolicyNameRefs resolve policyNames from CleanupPolicy managed resources
                          in the Repository's namespace. Resolved names replace policyNames.
                        items:
                          description: A Reference to a named object.
                          properties:
                            name:
                              description: Name of the referenced object.
                              type: string
                            policy:
                              description: Policies for referencing.
                              properties:
                                resolution:
                                  default: Required
                                  description: |-
                                    Resolution specifies whether resolution of this reference is required.
                                    The default is 'Required', which means the reconcile will fail if the
                                    reference cannot be resolved. 'Optional' means this reference will be
                                    a no-op if it cannot be resolved.
                                  enum:
                                  - Required
                                  - Optional
                                  type: string
                                resolve:
                                  description: |-
                                    Resolve specifies when this reference should be resolved. The default
                                    is 'IfNotPresent', which will attempt to resolve the reference only when
                                    the corresponding field is not present. Use 'Always' to resolve the
                                    reference on every reconcile.
                                  enum:
                                  - Always
                                  - IfNotPresent
                                  type: string
                              type: object
                          required:
                          - name
                          type: object
                        type: array
                      policyNameSelector:
                        description: |-
                          PolicyNameSelector selects CleanupPolicy managed resources in the
                          Repository's namespace to resolve policyNames.
                        properties:
                          matchControllerRef:
                            description: |-
                              MatchControllerRef ensures an object with the same controller reference
                              as the selecting object is selected.
                            type: boolean
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: MatchLabels ensures an object with matching
                              labels is selected.
                            type: object
                          policy:
                            description: Policies for selection.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        type: object
                      policyNames:
                        description: PolicyNames is a list of cleanup policy names.
                        items:
                          type: string
                        type: array
                    type: object
                  cosign:
                    description: |-
                      Cosign signature enforcement for OCI repositories. Enforcement is NONE
                      when it is left out.
                    properties:
                      enforcement:
                        description: |-
                          Enforcement is the cosign enforcement mode. NONE disables enforcement;
                          KEYLESS requires a valid cosign signature attached as an OCI referrer
                          for every pull. Nexus 3.96 does not implement KEYLESS yet and rejects
                          it.
                        enum:
                        - NONE
                        - KEYLESS
                        type: string
                      identityRegex:
                        description: |-
                          IdentityRegex is matched against the Fulcio certificate Subject
                          Alternative Name. It requires KEYLESS enforcement.
                        type: string
                      issuerRegex:
                        description: |-
                          IssuerRegex is matched against the OIDC issuer extension of the Fulcio
                          certificate. It requires KEYLESS enforcement.
                        type: string
                    required:
                    - enforcement
                    type: object
                    x-kubernetes-validations:
                    - message: 'identityRegex and issuerRegex require KEYLESS enforcement:
                        Nexus drops them otherwise.'
                      rule: self.enforcement == 'KEYLESS' || (!has(self.identityRegex)
                        && !has(self.issuerRegex))
                  docker:
                    description: Docker specific configuration.
                    properties:
                      forceBasicAuth:
                        description: |-
                          ForceBasicAuth forces basic authentication. It defaults to true; the
                          Docker or OCI Bearer Token realm is required when it is disabled.
                        type: boolean
                      httpPort:
                        description: HTTPPort creates an HTTP connector at this port.
                        format: int32
                        type: integer
                      httpsPort:
                        description: HTTPSPort creates an HTTPS connector at this
                          port.
                        format: int32
                        type: integer
                      pathEnabled:
                        description: PathEnabled allows the repository name in image
                          paths.
                        type: boolean
                      subdomain:
                        description: Subdomain serves the repository at this subdomain.
                        type: string
                      v1Enabled:
                        description: V1Enabled allows clients to use the V1 registry
                          API.
                        type: boolean
                    type: object
                  dockerProxy:
                    description: DockerProxy specific configuration for Docker proxy
                      repositories.
                    properties:
                      cacheForeignLayers:
                        description: CacheForeignLayers allows downloading and caching
                          foreign layers.
                        type: boolean
                      foreignLayerUrlWhitelist:
                        description: ForeignLayerUrlWhitelist is a list of regex patterns
                          for allowed foreign layer URLs.
                        items:
                          type: string
                        type: array
                      indexType:
                        description: |-
                          IndexType is the type of index (HUB, REGISTRY, CUSTOM). It defaults to
                          HUB for docker and to REGISTRY for oci, as Nexus does.
                        enum:
                        - HUB
                        - REGISTRY
                        - CUSTOM
                        type: string
                      indexUrl:
                        description: IndexURL is the URL of the index to use (for
                          CUSTOM type).
                        type: string
                    type: object
                  format:
                    description: Format of the repository (maven2, npm, docker, raw,
                      etc.).
                    enum:
                    - maven2
                    - npm
                    - docker
                    - raw
                    - nuget
                    - pypi
                    - rubygems
                    - yum
                    - apt
                    - helm
                    - go
                    - r
                    - conan
                    - conda
                    - cocoapods
                    - gitlfs
                    - p2
                    - cargo
                    - huggingface
                    - alpine
                    - ansiblegalaxy
                    - composer
                    - oci
                    - pub
                    - swift
                    - terraform
                    type: string
                    x-kubernetes-validations:
                    - message: Format is immutable.
                      rule: self == oldSelf
                  group:
                    description: Group configuration for group repositories.
                    properties:
                      memberNameRefs:
                        description: |-
                          MemberNameRefs resolve memberNames from Repository managed resources in
                          the group Repository's namespace. Resolved names replace memberNames, in
                          the order of the references.
                        items:
                          description: A Reference to a named object.
                          properties:
                            name:
                              description: Name of the referenced object.
                              type: string
                            policy:
                              description: Policies for referencing.
                              properties:
                                resolution:
                                  default: Required
                                  description: |-
                                    Resolution specifies whether resolution of this reference is required.
                                    The default is 'Required', which means the reconcile will fail if the
                                    reference cannot be resolved. 'Optional' means this reference will be
                                    a no-op if it cannot be resolved.
                                  enum:
                                  - Required
                                  - Optional
                                  type: string
                                resolve:
                                  description: |-
                                    Resolve specifies when this reference should be resolved. The default
                                    is 'IfNotPresent', which will attempt to resolve the reference only when
                                    the corresponding field is not present. Use 'Always' to resolve the
                                    reference on every reconcile.
                                  enum:
                                  - Always
                                  - IfNotPresent
                                  type: string
                              type: object
                          required:
                          - name
                          type: object
                        type: array
                      memberNameSelector:
                        description: |-
                          MemberNameSelector selects Repository managed resources in the group
                          Repository's namespace, other than the group itself, to resolve
                          memberNames, sorted by their Nexus names.
                        properties:
                          matchControllerRef:
                            description: |-
                              MatchControllerRef ensures an object with the same controller reference
                              as the selecting object is selected.
                            type: boolean
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: MatchLabels ensures an object with matching
                              labels is selected.
                            type: object
                          policy:
                            description: Policies for selection.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        type: object
                      memberNames:
                        description: MemberNames is a list of member repository names.
                        items:
                          type: string
                        type: array
                      writableMember:
                        description: WritableMember is the writable member of the
                          group (for Docker and Maven).
                        type: string
                    type: object
                  httpClient:
                    description: HTTPClient configuration for proxy repositories.
                    properties:
                      authentication:
                        description: Authentication configuration.
                        properties:
                          ntlmDomain:
                            description: NTLMDomain is the NTLM domain.
                            type: string
                          ntlmHost:
                            description: NTLMHost is the NTLM host.
                            type: string
                          passwordSecretRef:
                            description: |-
                              PasswordSecretRef is a reference to a secret containing the password.
                              The secret must be in the same namespace as the Repository.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          type:
                            description: Type of authentication.
                            enum:
                            - username
                            - ntlm
                            type: string
                          username:
                            description: Username for authentication.
                            type: string
                        type: object
                      autoBlock:
                        default: true
                        description: AutoBlock determines if the repository is auto-blocked.
                        type: boolean
                      blocked:
                        description: Blocked determines if the repository is blocked.
                        type: boolean
                      connection:
                        description: Connection configuration.
                        properties:
                          enableCircularRedirects:
                            description: EnableCircularRedirects enables circular
                              redirects.
                            type: boolean
                          enableCookies:
                            description: EnableCookies enables cookies.
                            type: boolean
                          retries:
                            description: Retries is the number of retries.
                            format: int32
                            type: integer
                          timeout:
                            description: Timeout is the connection timeout in seconds.
                            format: int32
                            type: integer
                          useTrustStore:
                            description: UseTrustStore uses the trust store.
                            type: boolean
                          userAgentSuffix:
                            description: UserAgentSuffix is a custom user agent suffix.
                            type: string
                        type: object
                    type: object
                  maven:
                    description: Maven specific configuration.
                    properties:
                      contentDisposition:
                        description: ContentDisposition for Maven repositories.
                        enum:
                        - INLINE
                        - ATTACHMENT
                        type: string
                      layoutPolicy:
                        description: LayoutPolicy for Maven repositories.
                        enum:
                        - STRICT
                        - PERMISSIVE
                        type: string
                      versionPolicy:
                        description: VersionPolicy for Maven repositories.
                        enum:
                        - RELEASE
                        - SNAPSHOT
                        - MIXED
                        type: string
                    type: object
                  name:
                    description: Name of the repository.
                    type: string
                    x-kubernetes-validations:
                    - message: Name is immutable.
                      rule: self == oldSelf
                  negativeCache:
                    description: NegativeCache configuration for proxy repositories.
                    properties:
                      enabled:
                        default: true
                        description: Enabled determines if negative caching is enabled.
                        type: boolean
                      timeToLive:
                        default: 1440
                        description: TimeToLive is the time to live for negative cache
                          entries in minutes.
                        format: int32
                        type: integer
                    type: object
                  npm:
                    description: |-
                      Npm specific configuration.

                      Deprecated: Nexus moved these settings to the Sonatype Repository
                      Firewall configuration and no longer accepts them on a repository, so
                      this field is ignored.
                    properties:
                      removeNonCataloged:
                        description: RemoveNonCataloged removes non-cataloged versions.
                        type: boolean
                      removeQuarantined:
                        description: RemoveQuarantined removes quarantined components.
                        type: boolean
                    type: object
                  nugetProxy:
                    description: NugetProxy specific configuration for NuGet proxy
                      repositories.
                    properties:
                      nugetVersion:
                        default: V3
                        description: NugetVersion is the NuGet protocol version (V2
                          or V3).
                        enum:
                        - V2
                        - V3
                        type: string
                      queryCacheItemMaxAge:
                        default: 3600
                        description: QueryCacheItemMaxAge is how long to cache query
                          results in seconds.
                        format: int32
                        type: integer
                    type: object
                  oci:
                    description: |-
                      Oci specific configuration for OCI repositories. It takes the same
                      settings as docker.
                    properties:
                      forceBasicAuth:
                        description: |-
                          ForceBasicAuth forces basic authentication. It defaults to true; the
                          Docker or OCI Bearer Token realm is required when it is disabled.
                        type: boolean
                      httpPort:
                        description: HTTPPort creates an HTTP connector at this port.
                        format: int32
                        type: integer
                      httpsPort:
                        description: HTTPSPort creates an HTTPS connector at this
                          port.
                        format: int32
                        type: integer
                      pathEnabled:
                        description: PathEnabled allows the repository name in image
                          paths.
                        type: boolean
                      subdomain:
                        description: Subdomain serves the repository at this subdomain.
                        type: string
                      v1Enabled:
                        description: V1Enabled allows clients to use the V1 registry
                          API.
                        type: boolean
                    type: object
                  ociProxy:
                    description: |-
                      OciProxy specific configuration for OCI proxy repositories. It takes
                      the same settings as dockerProxy.
                    properties:
                      cacheForeignLayers:
                        description: CacheForeignLayers allows downloading and caching
                          foreign layers.
                        type: boolean
                      foreignLayerUrlWhitelist:
                        description: ForeignLayerUrlWhitelist is a list of regex patterns
                          for allowed foreign layer URLs.
                        items:
                          type: string
                        type: array
                      indexType:
                        description: |-
                          IndexType is the type of index (HUB, REGISTRY, CUSTOM). It defaults to
                          HUB for docker and to REGISTRY for oci, as Nexus does.
                        enum:
                        - HUB
                        - REGISTRY
                        - CUSTOM
                        type: string
                      indexUrl:
                        description: IndexURL is the URL of the index to use (for
                          CUSTOM type).
                        type: string
                    type: object
                  online:
                    default: true
                    description: Online determines if the repository is online.
                    type: boolean
                  proxy:
                    description: Proxy configuration for proxy repositories.
                    properties:
                      contentMaxAge:
                        default: 1440
                        description: ContentMaxAge is the maximum age of cached content
                          in minutes.
                        format: int32
                        type: integer
                      metadataMaxAge:
                        default: 1440
                        description: MetadataMaxAge is the maximum age of cached metadata
                          in minutes.
                        format: int32
                        type: integer
                      remoteUrl:
                        description: RemoteURL is the URL of the remote repository.
                        type: string
                    required:
                    - remoteUrl
                    type: object
                  routingRule:
                    description: RoutingRule is the name of the routing rule for proxy
                      repositories.
                    type: string
                  routingRuleRef:
                    description: |-
                      RoutingRuleRef resolves routingRule from a RoutingRule managed resource
                      in the Repository's namespace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  routingRuleSelector:
                    description: |-
                      RoutingRuleSelector selects a RoutingRule managed resource in the
                      Repository's namespace to resolve routingRule.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  storage:
                    description: Storage configuration.
                    properties:
                      blobStoreName:
                        description: |-
                          BlobStoreName is the name of the blob store to use. It is required,
                          unless it is resolved through blobStoreNameRef or blobStoreNameSelector.
                        type: string
                      blobStoreNameRef:
                        description: |-
                          BlobStoreNameRef resolves blobStoreName from a BlobStore managed
                          resource in the Repository's namespace.
                        properties:
                          name:
                            description: Name of the referenced object.
                            type: string
                          policy:
                            description: Policies for referencing.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        required:
                        - name
                        type: object
                      blobStoreNameSelector:
                        description: |-
                          BlobStoreNameSelector selects a BlobStore managed resource in the
                          Repository's namespace to resolve blobStoreName.
                        properties:
                          matchControllerRef:
                            description: |-
                              MatchControllerRef ensures an object with the same controller reference
                              as the selecting object is selected.
                            type: boolean
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: MatchLabels ensures an object with matching
                              labels is selected.
                            type: object
                          policy:
                            description: Policies for selection.
                            properties:
                              resolution:
                                default: Required
                                description: |-
                                  Resolution specifies whether resolution of this reference is required.
                                  The default is 'Required', which means the reconcile will fail if the
                                  reference cannot be resolved. 'Optional' means this reference will be
                                  a no-op if it cannot be resolved.
                                enum:
                                - Required
                                - Optional
                                type: string
                              resolve:
                                description: |-
                                  Resolve specifies when this reference should be resolved. The default
                                  is 'IfNotPresent', which will attempt to resolve the reference only when
                                  the corresponding field is not present. Use 'Always' to resolve the
                                  reference on every reconcile.
                                enum:
                                - Always
                                - IfNotPresent
                                type: string
                            type: object
                        type: object
                      strictContentTypeValidation:
                        default: true
                        description: StrictContentTypeValidation enables strict content
                          type validation.
                        type: boolean
                      writePolicy:
                        description: WritePolicy for hosted repositories.
                        enum:
                        - ALLOW
                        - ALLOW_ONCE
                        - DENY
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: one of blobStoreName, blobStoreNameRef or blobStoreNameSelector
                        is required.
                      rule: has(self.blobStoreName) || has(self.blobStoreNameRef)
                        || has(self.blobStoreNameSelector)
                  swift:
                    description: Swift specific configuration for Swift proxy repositories.
                    properties:
                      requireAuthentication:
                        description: |-
                          RequireAuthentication indicates if this repository requires
                          authentication. It is turned off when left unset.
                        type: boolean
                    type: object
                  terraform:
                    description: Terraform specific configuration for Terraform group
                      repositories.
                    properties:
                      requireAuthentication:
                        description: |-
                          RequireAuthentication indicates if this repository requires
                          authentication. It is turned off when left unset.
                        type: boolean
                    type: object
                  terraformSigning:
                    description: |-
                      TerraformSigning is the PGP key Nexus signs the providers of a
                      Terraform hosted repository with. It is required for hosted
                      repositories, unless the managementPolicies only observe the
                      repository.
                    properties:
                      keypair:
                        description: Keypair is the PGP signing key pair (armored
                          private key).
                        type: string
                      passphrase:
                        description: Passphrase to access the PGP signing key.
                        type: string
                    required:
                    - keypair
                    type: object
                  type:
                    description: Type of the repository (hosted, proxy, group).
                    enum:
                    - hosted
                    - proxy
                    - group
                    type: string
                    x-kubernetes-validations:
                    - message: Type is immutable.
                      rule: self == oldSelf
                  yum:
                    description: Yum specific configuration.
                    properties:
                      deployPolicy:
                        description: DeployPolicy for Yum repositories.
                        enum:
                        - STRICT
                        - PERMISSIVE
                        type: string
                      repodataDepth:
                        description: RepodataDepth is the repodata depth.
                        format: int32
                        maximum: 5
                        minimum: 0
                        type: integer
                    type: object
                  yumSigning:
                    description: YumSigning configuration for Yum repositories.
                    properties:
                      keypair:
                        description: Keypair is the PGP signing key pair (armored
                          private key).
                        type: string
