---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: httpclients.instance.nexus.crossplane.io
spec:
  group: instance.nexus.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nexus
    kind: HTTPClient
    listKind: HTTPClientList
    plural: httpclients
    singular: httpclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HTTPClient manages the Nexus HTTP client settings: the User-Agent suffix,
          timeout, retries and outbound HTTP and HTTPS proxies. It is a singleton:
          declare at most one per Nexus instance. Deleting it resets every HTTP
          client setting to the Nexus default. Requires Nexus Repository Pro.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HTTPClientSpec defines the desired Nexus HTTP client state.
            properties:
              forProvider:
                description: ForProvider holds the provider-specific configuration
                  for this resource.
                properties:
                  httpProxy:
                    description: |-
                      HTTPProxy is the proxy for outbound HTTP requests. If unset, no HTTP
                      proxy is used.
                    properties:
                      authentication:
                        description: |-
                          Authentication holds the proxy credentials. If unset, the proxy is used
                          without authentication.
                        properties:
                          ntlmDomain:
                            description: NTLMDomain is the Windows NTLM domain.
                            type: string
                          ntlmHost:
                            description: NTLMHost is the Windows NTLM host name.
                            type: string
                          passwordSecretRef:
                            description: |-
                              PasswordSecretRef references the Kubernetes Secret key holding the
                              proxy password. The secret must be in the same namespace as the
                              HTTPClient.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          username:
                            description: Username is the proxy user name.
                            minLength: 1
                            type: string
                        required:
                        - passwordSecretRef
                        - username
                        type: object
                      host:
                        description: Host is the proxy host name or IP address.
                        minLength: 1
                        type: string
                      port:
                        description: Port is the proxy port.
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                  httpsProxy:
                    description: |-
                      HTTPSProxy is the proxy for outbound HTTPS requests. If unset, no HTTPS
                      proxy is used.
                    properties:
                      authentication:
                        description: |-
                          Authentication holds the proxy credentials. If unset, the proxy is used
                          without authentication.
                        properties:
                          ntlmDomain:
                            description: NTLMDomain is the Windows NTLM domain.
                            type: string
                          ntlmHost:
                            description: NTLMHost is the Windows NTLM host name.
                            type: string
                          passwordSecretRef:
                            description: |-
                              PasswordSecretRef references the Kubernetes Secret key holding the
                              proxy password. The secret must be in the same namespace as the
                              HTTPClient.
                            properties:
                              key:
                                type: string
                              name:
                                description: Name of the secret.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          username:
                            description: Username is the proxy user name.
                            minLength: 1
                            type: string
                        required:
                        - passwordSecretRef
                        - username
                        type: object
                      host:
                        description: Host is the proxy host name or IP address.
                        minLength: 1
                        type: string
                      port:
                        description: Port is the proxy port.
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                  nonProxyHosts:
                    description: |-
                      NonProxyHosts are the hosts reached without a proxy. Nexus accepts
                      wildcards such as *.example.com.
                    items:
                      pattern: ^\S+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  retries:
                    description: |-
                      Retries is the number of connection and socket retry attempts of
                      outbound requests. If unset, the value in Nexus is kept.
                    maximum: 10
                    minimum: 0
                    type: integer
                  timeoutSeconds:
                    description: |-
                      TimeoutSeconds is the connection and socket timeout of outbound
                      requests, in seconds. If unset, the value in Nexus is kept.
                    maximum: 3600
                    minimum: 1
                    type: integer
                  userAgentSuffix:
                    description: |-
                      UserAgentSuffix is appended to the User-Agent header of outbound
                      requests. If unset, the value in Nexus is kept.
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: HTTPClientStatus holds the observed Nexus HTTP client state.
            properties:
              atProvider:
                description: AtProvider holds the provider-specific observed state.
                properties:
                  credentialsFingerprint:
                    description: |-
                      CredentialsFingerprint identifies the proxy credentials last applied
                      to Nexus, which Nexus never reports back. It changes when a referenced
                      Secret changes or is repointed, which triggers an update.
                    type: string
                  httpProxy:
                    description: HTTPProxy is the observed HTTP proxy, absent when
                      disabled.
                    properties:
                      host:
                        description: Host is the observed proxy host.
                        type: string
                      ntlmDomain:
                        description: NTLMDomain is the observed Windows NTLM domain.
                        type: string
                      ntlmHost:
                        description: NTLMHost is the observed Windows NTLM host name.
                        type: string
                      port:
                        description: Port is the observed proxy port.
                        type: integer
                      username:
                        description: |-
                          Username is the observed proxy user name, absent without
                          authentication.
                        type: string
                    required:
                    - host
                    - port
                    type: object
                  httpsProxy:
                    description: HTTPSProxy is the observed HTTPS proxy, absent when
                      disabled.
                    properties:
                      host:
                        description: Host is the observed proxy host.
                        type: string
                      ntlmDomain:
                        description: NTLMDomain is the observed Windows NTLM domain.
                        type: string
                      ntlmHost:
                        description: NTLMHost is the observed Windows NTLM host name.
                        type: string
                      port:
                        description: Port is the observed proxy port.
                        type: integer
                      username:
                        description: |-
                          Username is the observed proxy user name, absent without
                          authentication.
                        type: string
                    required:
                    - host
                    - port
                    type: object
                  nonProxyHosts:
                    description: NonProxyHosts are the observed hosts reached without
                      a proxy.
                    items:
                      type: string
                    type: array
                  resetToDefaults:
                    description: |-
                      ResetToDefaults is true once the provider has reset the Nexus HTTP
                      client settings to their defaults while deleting this resource.
                    type: boolean
                  retries:
                    description: Retries is the observed number of connection and
                      socket retries.
                    type: integer
                  timeoutSeconds:
                    description: TimeoutSeconds is the observed connection and socket
                      timeout.
                    type: integer
                  userAgentSuffix:
                    description: UserAgentSuffix is the observed User-Agent suffix.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
