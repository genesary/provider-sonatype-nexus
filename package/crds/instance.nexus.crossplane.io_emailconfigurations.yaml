---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: emailconfigurations.instance.nexus.crossplane.io
spec:
  group: instance.nexus.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nexus
    kind: EmailConfiguration
    listKind: EmailConfigurationList
    plural: emailconfigurations
    singular: emailconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.enabled
      name: ENABLED
      type: boolean
    - jsonPath: .status.atProvider.host
      name: HOST
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EmailConfiguration manages the Nexus email server settings, which Nexus
          uses to send notifications such as task alerts and password resets.

          It is a singleton: declare at most one EmailConfiguration per Nexus
          instance, across all namespaces and ProviderConfigs pointing at that
          instance. The provider does not enforce this. With two of them, each
          reconcile replaces the settings the other applied. Deleting it resets the
          email server settings, which disables email.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EmailConfigurationSpec defines the desired Nexus email server
              state.
            properties:
              forProvider:
                description: ForProvider holds the provider-specific configuration
                  for this resource.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled indicates whether Nexus sends emails.
                      If unset, will default to true.
                    type: boolean
                  fromAddress:
                    description: FromAddress is the sender address of the emails Nexus
                      sends.
                    minLength: 1
                    type: string
                  host:
                    description: |-
                      Host is the SMTP server host name or IP address. Nexus resolves it when
                      the configuration is applied and refuses a host it cannot resolve. It
                      also refuses a host that resolves to a private, loopback or link-local
                      address while SSRF protection is enabled, unless the host or address is
                      allowed by the SSRFProtection settings.
                    minLength: 1
                    type: string
                  nexusTrustStoreEnabled:
                    description: |-
                      NexusTrustStoreEnabled verifies the SMTP server certificate against
                      the Nexus truststore (see SecuritySSLTruststore) rather than the JVM
                      one.
                    type: boolean
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef references the Kubernetes Secret key holding the
                      SMTP password. The secret must be in the same namespace as the
                      EmailConfiguration.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    description: Port is the SMTP server port.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  sslOnConnectEnabled:
                    description: SSLOnConnectEnabled connects to the SMTP server over
                      SSL/TLS.
                    type: boolean
                  sslServerIdentityCheckEnabled:
                    description: |-
                      SSLServerIdentityCheckEnabled verifies the SMTP server certificate
                      when TLS or SSL is used.
                    type: boolean
                  startTlsEnabled:
                    description: StartTLSEnabled enables STARTTLS when the SMTP server
                      supports it.
                    type: boolean
                  startTlsRequired:
                    description: |-
                      StartTLSRequired refuses to send emails when the SMTP server does not
                      support STARTTLS.
                    type: boolean
                  subjectPrefix:
                    description: SubjectPrefix is prepended to the subject of every
                      email Nexus sends.
                    type: string
                  username:
                    description: |-
                      Username is the SMTP user name. If unset, Nexus connects without
                      authentication.
                    type: string
                required:
                - fromAddress
                - host
                - port
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: EmailConfigurationStatus holds the observed Nexus email server
              state.
            properties:
              atProvider:
                description: AtProvider holds the provider-specific observed state.
                properties:
                  credentialsFingerprint:
                    description: |-
                      CredentialsFingerprint identifies the password last applied to Nexus,
                      which Nexus never reports back. It changes when the referenced Secret
                      changes or is repointed, which triggers an update.
                    type: string
                  enabled:
                    description: Enabled reflects whether Nexus sends emails.
                    type: boolean
                  fromAddress:
                    description: FromAddress is the observed sender address.
                    type: string
                  host:
                    description: Host is the observed SMTP server host.
                    type: string
                  nexusTrustStoreEnabled:
                    description: NexusTrustStoreEnabled reflects whether the Nexus
                      truststore is used.
                    type: boolean
                  port:
                    description: Port is the observed SMTP server port.
                    type: integer
                  sslOnConnectEnabled:
                    description: SSLOnConnectEnabled reflects whether Nexus connects
                      over SSL/TLS.
                    type: boolean
                  sslServerIdentityCheckEnabled:
                    description: |-
                      SSLServerIdentityCheckEnabled reflects whether the server certificate
                      is verified.
                    type: boolean
                  startTlsEnabled:
                    description: StartTLSEnabled reflects whether STARTTLS is enabled.
                    type: boolean
                  startTlsRequired:
                    description: StartTLSRequired reflects whether STARTTLS is required.
                    type: boolean
                  subjectPrefix:
                    description: SubjectPrefix is the observed email subject prefix.
                    type: string
                  username:
                    description: Username is the observed SMTP user name.
                    type: string
                required:
                - enabled
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
