---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: blobstores.instance.nexus.crossplane.io
spec:
  group: instance.nexus.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nexus
    kind: BlobStore
    listKind: BlobStoreList
    plural: blobstores
    singular: blobstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BlobStore is the Schema for the blobstores API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BlobStoreSpec defines the desired state of BlobStore.
            properties:
              forProvider:
                description: BlobStoreParameters defines the desired state of a BlobStore.
                properties:
                  azureConfig:
                    description: |-
                      AzureConfig defines the Azure Blob Storage configuration of an Azure
                      type blob store. Required when the type is Azure.
                    properties:
                      accountKeySecretRef:
                        description: |-
                          AccountKeySecretRef references the Kubernetes Secret key holding the
                          storage account key. The secret must be in the same namespace as the
                          BlobStore. Required when the authentication method is ACCOUNTKEY.
                        properties:
                          key:
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      accountName:
                        description: AccountName is the Azure storage account name.
                        minLength: 1
                        type: string
                      authenticationMethod:
                        description: |-
                          AuthenticationMethod selects how Nexus authenticates to Azure:
                          ACCOUNTKEY with the account key in accountKeySecretRef,
                          MANAGEDIDENTITY with the managed identity of the Nexus host, or
                          ENVIRONMENTVARIABLE with the credentials in the Nexus environment.
                        enum:
                        - ACCOUNTKEY
                        - MANAGEDIDENTITY
                        - ENVIRONMENTVARIABLE
                        type: string
                      containerName:
                        description: |-
                          ContainerName is the name of an existing container of the storage
                          account, which holds the blobs.
                        pattern: ^[a-z0-9][a-z0-9-]{2,62}$
                        type: string
                      preSignedUrlEnabled:
                        description: |-
                          PreSignedURLEnabled enables direct downloads from Azure through SAS
                          URLs. If unset, Nexus applies its default and the setting is not
                          checked for drift.
                        type: boolean
                    required:
                    - accountName
                    - authenticationMethod
                    - containerName
                    type: object
                    x-kubernetes-validations:
                    - message: accountKeySecretRef is required when authenticationMethod
                        is ACCOUNTKEY.
                      rule: self.authenticationMethod != 'ACCOUNTKEY' || has(self.accountKeySecretRef)
                    - message: accountKeySecretRef is only allowed when authenticationMethod
                        is ACCOUNTKEY.
                      rule: self.authenticationMethod == 'ACCOUNTKEY' || !has(self.accountKeySecretRef)
                  name:
                    description: Name of the blob store.
                    type: string
                    x-kubernetes-validations:
                    - message: Name is immutable.
                      rule: self == oldSelf
                  path:
                    description: Path for File type blob store.
                    type: string
                  s3Config:
                    description: S3Config defines S3 configuration for S3 type blob
                      store.
                    properties:
                      accessKeyIdSecretRef:
                        description: AccessKeyIDSecretRef is a reference to a secret
                          containing the access key ID.
                        properties:
                          key:
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      assumeRole:
                        description: AssumeRole for S3 access.
                        type: string
                      bucket:
                        description: Bucket name.
                        type: string
                      endpoint:
                        description: Endpoint URL for S3 compatible storage.
                        type: string
                      expirationDays:
                        description: |-
                          Expiration days for objects.

                          Deprecated: Nexus no longer accepts a bucket expiration, so this field
                          is ignored.
                        format: int32
                        type: integer
                      forcePathStyle:
                        description: ForcePathStyle enables path-style access for
                          S3.
                        type: boolean
                      prefix:
                        description: Prefix for objects in the bucket.
                        type: string
                      region:
                        description: Region of the S3 bucket.
                        type: string
                      secretAccessKeySecretRef:
                        description: SecretAccessKeySecretRef is a reference to a
                          secret containing the secret access key.
                        properties:
                          key:
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sessionTokenSecretRef:
                        description: SessionToken for S3 access.
                        properties:
                          key:
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - bucket
                    type: object
                  softQuota:
                    description: SoftQuota defines the soft quota configuration.
                    properties:
                      limit:
                        description: Limit in bytes.
                        format: int64
                        type: integer
                      type:
                        description: Type of the soft quota.
                        enum:
                        - spaceRemainingQuota
                        - spaceUsedQuota
                        type: string
                    type: object
                  type:
                    default: File
                    description: |-
                      Type of the blob store (File, S3 or Azure). Azure blob stores require
                      Nexus Repository Pro.
                    enum:
                    - File
                    - S3
                    - Azure
                    type: string
                    x-kubernetes-validations:
                    - message: Type is immutable.
                      rule: self == oldSelf
                required:
                - name
                - type
                type: object
                x-kubernetes-validations:
                - message: azureConfig is required when type is Azure.
                  rule: self.type != 'Azure' || has(self.azureConfig)
                - message: azureConfig is only allowed when type is Azure.
                  rule: self.type == 'Azure' || !has(self.azureConfig)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: BlobStoreStatus defines the observed state of BlobStore.
            properties:
              atProvider:
                description: BlobStoreObservation represents the observed state of
                  a BlobStore.
                properties:
                  accountName:
                    description: AccountName is the observed storage account of an
                      Azure blob store.
                    type: string
                  authenticationMethod:
                    description: |-
                      AuthenticationMethod is the observed authentication method of an Azure
                      blob store.
                    type: string
                  availableSpaceInBytes:
                    description: AvailableSpaceInBytes is the free space reported
                      by the blob store.
                    format: int64
                    type: integer
                  blobCount:
                    description: BlobCount is the number of blobs held by the blob
                      store.
                    format: int64
                    type: integer
                  bucketExpirationDays:
                    description: |-
                      BucketExpirationDays is the observed number of days before deleted
                      blobs expire from the S3 bucket.

                      Deprecated: Nexus no longer reports a bucket expiration, so this field
                      is never set.
                    format: int32
                    type: integer
                  bucketName:
                    description: BucketName is the observed bucket name of an S3 blob
                      store.
                    type: string
                  bucketPrefix:
                    description: BucketPrefix is the observed bucket prefix of an
                      S3 blob store.
                    type: string
                  bucketRegion:
                    description: BucketRegion is the observed bucket region of an
                      S3 blob store.
                    type: string
                  containerName:
                    description: ContainerName is the observed container of an Azure
                      blob store.
                    type: string
                  credentialsFingerprint:
                    description: |-
                      CredentialsFingerprint identifies the Azure account key last applied
                      to Nexus, which Nexus never reports back. It changes when the
                      referenced Secret changes or is repointed, which triggers an update.
                    type: string
                  name:
                    description: Name is the observed blob store name.
                    type: string
                  path:
                    description: Path is the observed path of a File blob store.
                    type: string
                  preSignedUrlEnabled:
                    description: |-
                      PreSignedURLEnabled is whether the observed Azure blob store serves
                      downloads through SAS URLs.
                    type: boolean
                  softQuotaLimit:
                    description: SoftQuotaLimit is the observed soft quota limit.
                    format: int64
                    type: integer
                  softQuotaType:
                    description: SoftQuotaType is the observed soft quota type.
                    type: string
                  totalSizeInBytes:
                    description: TotalSizeInBytes is the total size reported by the
                      blob store.
                    format: int64
                    type: integer
                  type:
                    description: |-
                      Type is the observed blob store type, as reported by the blob store
                      listing.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
